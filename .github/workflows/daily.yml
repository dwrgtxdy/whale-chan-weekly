name: daily-crawl
on:
  schedule:
    - cron: '0 14 * * *'      # 22:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取当日候选
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
          VIEW_BUDGET: '40'
        run: node scripts/fetch.mjs
      - name: 提交数据
        run: |
          git config user.name "whale-chan-bot"
          git config user.email "whale-chan-bot@users.noreply.github.com"
          git add data/daily
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: daily $(date -u +%F)"; git push; fi
